name: Build WeList

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Packages
        run: npm install

      - name: Generate Pages
        run: node scripts/generate.js

      - name: Commit Generated Pages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Auto Generate Pages

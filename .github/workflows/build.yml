name: Generate Hotel Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'data/*.csv'
      - 'scripts/generate.js'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm install
        
      - name: Generate hotel pages
        run: node scripts/generate.js
        
      - name: Commit generated files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add b/
          git diff --quiet && git diff --staged --quiet || git commit -m "Generate hotel pages"
          git push
